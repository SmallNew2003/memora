    - 自然语言正文以中文为主，保留必要的英文术语、标识符、代码、命令和协议关键字。
  design:
    - 自然语言正文以中文为主，保留必要的英文术语、标识符、代码、命令和协议关键字。
  specs:
    - 自然语言正文以中文为主，保留 OpenSpec 结构关键字、必要的英文术语、标识符、代码、命令和协议关键字。
  tasks:
    - 自然语言正文以中文为主，保留必要的英文术语、标识符、代码、命令和协议关键字。
